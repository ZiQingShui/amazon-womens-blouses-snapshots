<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>女式衬衫新品榜｜历史总看板</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#182230;--muted:#667085;--line:#e5e9f0;--red:#d92d20;--blue:#175cd3;--green:#087a55;--orange:#b54708}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,"Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.wrap{max-width:1720px;margin:auto;padding:17px 24px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px}.heading{display:flex;align-items:center;gap:12px}.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:#e1251b;color:#fff;font-size:12px;font-weight:900;box-shadow:0 7px 17px rgba(225,37,27,.2)}h1{margin:0;font-size:21px;line-height:1.25}.sub{margin-top:2px;color:var(--muted);font-size:12px}
.controls{display:flex;align-items:center;gap:8px}.picker{display:flex;align-items:center;gap:8px;padding:5px 7px 5px 11px;border:1px solid var(--line);border-radius:12px;background:#fff;color:#667085;font-size:12px}.picker select{min-width:170px;border:0;outline:0;background:#f3f5f8;color:#182230;padding:8px 10px;border-radius:8px;font-weight:800;cursor:pointer}.compare-toggle{border:1px solid var(--line);border-radius:11px;background:#fff;padding:9px 12px;color:#475467;font-size:13px;font-weight:800;cursor:pointer}.compare-toggle.active{border-color:#b2ccff;background:#eef4ff;color:#175cd3}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:15px 0}.metric{padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:#fff}.metric span{display:block;color:var(--muted);font-size:12px}.metric b{display:block;margin-top:2px;font-size:20px}.metric.green b{color:var(--green)}.metric.blue b{color:var(--blue)}.metric.orange b{color:var(--orange)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:13px 0;color:var(--muted);font-size:13px}.bar strong{color:var(--ink)}.source{color:var(--blue);text-decoration:none;font-weight:750}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}.card{min-width:0;overflow:hidden;border-radius:20px;background:var(--card);box-shadow:0 8px 24px rgba(21,35,67,.09);transition:.18s}.card:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(21,35,67,.14)}.photo{position:relative;aspect-ratio:1/1;display:grid;place-items:center;background:#fff}.photo img{width:100%;height:100%;object-fit:contain;padding:14px}.rank{position:absolute;left:13px;top:13px;padding:6px 10px;border-radius:999px;background:rgba(24,34,48,.93);color:#fff;font-size:12px;font-weight:850}.rank.new{background:#d92d20}.price{position:absolute;right:13px;bottom:13px;padding:7px 10px;border-radius:10px;background:#fff;color:#b42318;box-shadow:0 5px 18px rgba(16,24,40,.17);font-size:20px;font-weight:900}.body{padding:15px}.brand{margin-bottom:6px;color:#667085;font-size:12px;font-weight:850;letter-spacing:.07em;text-transform:uppercase}.title{height:44px;overflow:hidden;color:#202939;font-size:14px;line-height:22px;font-weight:700}.movement{margin-top:10px;padding:8px 9px;border-radius:9px;background:#f7f8fa;color:#475467;font-size:12px;font-weight:750}.movement.up{background:#eaf7f1;color:#087a55}.movement.down{background:#fff4ed;color:#b54708}.movement.new{background:#fff1f0;color:#b42318}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{max-width:100%;padding:6px 8px;border-radius:999px;background:#eef4ff;color:#244b9b;font-size:12px;font-weight:800;line-height:1.35}.chip.promo{background:#fff1f0;color:#b42318}.chip.none{background:#eaf7f1;color:#087a55}.date{display:flex;justify-content:space-between;gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid #edf0f4;color:var(--muted);font-size:12px}.date b{color:#344054;text-align:right}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:11px}.asin{color:#667085;font:11px ui-monospace,Consolas,monospace}.actions a{color:var(--blue);font-weight:800;text-decoration:none}
.exits{margin-top:24px;border:1px solid var(--line);border-radius:16px;background:#fff}.exits summary{cursor:pointer;padding:15px 17px;font-weight:850}.exit-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px 16px}.exit{display:flex;align-items:center;gap:9px;padding:8px;border-radius:10px;background:#f7f8fa}.exit img{width:48px;height:48px;object-fit:contain;border-radius:8px;background:#fff}.exit div{min-width:0}.exit b,.exit span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.exit b{font-size:12px}.exit span{color:var(--muted);font-size:11px}.empty{grid-column:1/-1;padding:50px;text-align:center;background:#fff;border-radius:16px;color:var(--muted)}
@media(max-width:1200px){.grid{grid-template-columns:repeat(4,1fr)}.metrics{grid-template-columns:repeat(3,1fr)}}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}.top{align-items:flex-start;flex-direction:column}.controls{width:100%}.exit-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.wrap{padding:13px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.metrics{grid-template-columns:repeat(2,1fr)}.bar{align-items:flex-start;flex-direction:column}.controls{align-items:stretch;flex-direction:column}.picker{justify-content:space-between}.picker select{flex:1}.compare-toggle{width:100%}}@media(max-width:430px){.grid,.metrics,.exit-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap top"><div class="heading"><div class="mark">NEW</div><div><h1>女式衬衫新品榜｜历史总看板</h1><div class="sub">Amazon 美国站 · Women's Blouses &amp; Button-Down Shirts</div></div></div><div class="controls"><label class="picker">快照日期<select id="dateSelect" aria-label="选择快照日期"></select></label><button class="compare-toggle active" id="compareToggle" type="button" aria-pressed="true">与前一快照对比</button></div></div></header>
<main class="wrap"><section class="metrics" id="metrics"></section><div class="bar"><span id="viewText">正在载入…</span><a class="source" href="https://www.amazon.com/gp/new-releases/fashion/2368365011" target="_blank" rel="noreferrer">Amazon 官方新品榜</a></div><section class="grid" id="products"></section><div id="exitArea"></div></main>
<script src="amazon_womens_blouses_snapshot_registry.js"></script>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const snapshots=Array.isArray(window.SNAPSHOT_INDEX)?window.SNAPSHOT_INDEX:[],cache=new Map();let currentData=[],previousData=[],previousMap=new Map(),entrants=[],exits=[],retained=[],compareEnabled=true,currentEntry=null,previousEntry=null;
function loadSnapshot(entry){if(!entry)return Promise.resolve([]);if(cache.has(entry.date))return Promise.resolve(cache.get(entry.date));return new Promise((resolve,reject)=>{const script=document.createElement("script");script.src=entry.file;script.onload=()=>{const data=Array.isArray(window.NEW_RELEASES)?window.NEW_RELEASES:[];cache.set(entry.date,data);delete window.NEW_RELEASES;script.remove();resolve(data)};script.onerror=()=>reject(new Error(`无法载入 ${entry.file}`));document.head.appendChild(script)})}
const money=v=>{const n=parseFloat(String(v||"").replace(/[^\d.]/g,""));return Number.isFinite(n)?n:null};
function movement(p,compare){if(!compare||!previousEntry)return "";const old=previousMap.get(p.asin);if(!old)return '<div class="movement new">本期新入榜</div>';const delta=old.rank-p.rank,priceDelta=(money(p.price)??0)-(money(old.price)??0);const trend=delta>0?`上升 ${delta} 位`:delta<0?`下降 ${Math.abs(delta)} 位`:"名次不变";const pc=Math.abs(priceDelta)>.001?` · 价格${priceDelta>0?"上涨":"下降"} $${Math.abs(priceDelta).toFixed(2)}`:"";return `<div class="movement ${delta>0?"up":delta<0?"down":""}">前期 #${old.rank} → 本期 #${p.rank} · ${trend}${pc}</div>`}
function age(date){if(!date)return "数据未返回";const [y,m,d]=date.split("-").map(Number),a=new Date(y,m-1,d),b=new Date();b.setHours(0,0,0,0);const days=Math.floor((b-a)/86400000);return `${date} · ${days===0?"今天上架":days>0?`已上架 ${days} 天`:`${Math.abs(days)} 天后上架`}`}
function card(p,compare=false){const main=p.mainBsr?`#${Number(p.mainBsr).toLocaleString("en-US")}`:"数据未返回";const subs=Array.isArray(p.subRanks)&&p.subRanks.length?p.subRanks:(p.subBsr?[{rank:p.subBsr,category:p.subCategory}]:[]);const subHtml=subs.length?subs.map(x=>`<span class="chip" title="${esc(x.category||"")}">小类 #${Number(x.rank).toLocaleString("en-US")}</span>`).join(""):'<span class="chip">小类 数据未返回</span>';const promo=p.promotionStatus==="none"?"暂无促销":(p.promotion||"数据未返回");const isNew=compare&&previousEntry&&!previousMap.has(p.asin);return `<article class="card"><div class="photo"><img loading="lazy" src="${esc(p.image)}" alt="${esc(p.title)}"><span class="rank ${isNew?"new":""}">${isNew?"NEW · ":"新品 "}#${p.rank}</span><span class="price">${esc(p.price||"价格未显示")}</span></div><div class="body"><div class="brand">${esc(p.brand||"品牌未显示")}</div><div class="title" title="${esc(p.title)}">${esc(p.title)}</div>${movement(p,compare)}<div class="chips"><span class="chip" title="${esc(p.mainCategory||"")}">大类 ${main}</span>${subHtml}<span class="chip promo ${p.promotionStatus==="none"?"none":""}">${esc(promo)}</span></div><div class="date"><span>上架时间</span><b>${esc(age(p.listingDate))}</b></div><div class="actions"><span class="asin">${esc(p.asin)}</span><a href="${esc(p.url)}" target="_blank" rel="noreferrer">商品详情</a></div></div></article>`}
function metricData(){const promo=currentData.filter(p=>p.promotionStatus==="detected").length,dates=currentData.filter(p=>p.listingDate).length;if(compareEnabled&&previousEntry)return [["本期商品",currentData.length],["继续在榜",retained.length,"green"],["本期新入榜",entrants.length,"blue"],["前期退出",exits.length,"orange"],["促销商品",promo,"green"]];return [["榜单商品",currentData.length],["促销商品",promo,"green"],["BSR完整",currentData.filter(p=>p.mainBsr&&p.subBsr).length,"blue"],["上架日期",dates],["缺失名次",100-currentData.length,"orange"]]}
function render(){document.getElementById("metrics").innerHTML=metricData().map(x=>`<div class="metric ${x[2]||""}"><span>${x[0]}</span><b>${x[1]}</b></div>`).join("");const compare=compareEnabled&&previousEntry;document.getElementById("viewText").innerHTML=`<strong>${currentEntry.label} · ${currentEntry.time}</strong> 快照 · Top ${currentData.length} · 每行 5 件${compare?` · 对比 ${previousEntry.label}：新入榜 ${entrants.length}，退出 ${exits.length}`:""}`;document.getElementById("products").innerHTML=currentData.length?currentData.map(p=>card(p,compare)).join(""):'<div class="empty">该日期没有可用快照</div>';document.getElementById("exitArea").innerHTML=compare?`<details class="exits"><summary>查看前一快照退出榜单的 ${exits.length} 个商品</summary><div class="exit-grid">${exits.map(p=>`<div class="exit"><img loading="lazy" src="${esc(p.image)}" alt=""><div><b>前期 #${p.rank} · ${esc(p.brand||p.asin)}</b><span>${esc(p.title)}</span></div></div>`).join("")}</div></details>`:""}
async function selectSnapshot(date){const index=snapshots.findIndex(x=>x.date===date);currentEntry=snapshots[index];previousEntry=snapshots[index+1]||null;document.getElementById("products").innerHTML='<div class="empty">正在载入快照…</div>';currentData=await loadSnapshot(currentEntry);previousData=await loadSnapshot(previousEntry);previousMap=new Map(previousData.map(p=>[p.asin,p]));const currentMap=new Map(currentData.map(p=>[p.asin,p]));retained=currentData.filter(p=>previousMap.has(p.asin));entrants=currentData.filter(p=>!previousMap.has(p.asin));exits=previousData.filter(p=>!currentMap.has(p.asin));compareEnabled=compareEnabled&&Boolean(previousEntry);document.getElementById("compareToggle").disabled=!previousEntry;document.getElementById("compareToggle").classList.toggle("active",compareEnabled);document.getElementById("compareToggle").setAttribute("aria-pressed",String(compareEnabled));render()}
const select=document.getElementById("dateSelect");select.innerHTML=snapshots.map((x,i)=>`<option value="${esc(x.date)}"${i===0?" selected":""}>${esc(x.label)} · ${esc(x.time)}</option>`).join("");select.addEventListener("change",()=>selectSnapshot(select.value));document.getElementById("compareToggle").addEventListener("click",()=>{if(!previousEntry)return;compareEnabled=!compareEnabled;document.getElementById("compareToggle").classList.toggle("active",compareEnabled);document.getElementById("compareToggle").setAttribute("aria-pressed",String(compareEnabled));render()});selectSnapshot(snapshots[0]?.date).catch(()=>{document.getElementById("products").innerHTML='<div class="empty">快照载入失败，请刷新页面重试</div>'});
</script>
</body>
</html>
