<style>

@media(max-width:1300px){.grid{grid-template-columns:repeat(4,1fr)}.metrics{grid-template-columns:repeat(3,1fr)}.filter-grid.quick{grid-template-columns:repeat(3,1fr)}}@media(max-width:940px){.grid{grid-template-columns:repeat(3,1fr)}.top,.summary-top{align-items:flex-start;flex-direction:column}.controls{width:100%}.quality{text-align:left}.exit-grid{grid-template-columns:repeat(2,1fr)}.filter-grid.primary{grid-template-columns:1.5fr 1fr}}@media(max-width:650px){.wrap{padding:13px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.metrics{grid-template-columns:repeat(2,1fr)}.bar{align-items:flex-start;flex-direction:column}.controls{align-items:stretch;flex-direction:column}.picker{justify-content:space-between}.picker select{flex:1}.toggle{width:100%}.filter-grid.primary,.filter-grid.quick,.advanced-grid{grid-template-columns:repeat(2,1fr)}.field.search{grid-column:1/-1}}@media(max-width:430px){.grid,.metrics,.exit-grid,.filter-grid.primary,.filter-grid.quick,.advanced-grid{grid-template-columns:1fr}.field.search{grid-column:auto}}

<body>
<header><div class="wrap top"><div class="heading"><div class="mark">NEW</div><div><h1>女式衬衫新品榜｜每日快照</h1><div class="sub">Amazon 美国站 · Women's Blouses &amp; Button-Down Shirts · Top 100</div></div></div><div class="controls"><label class="picker">快照日期<select id="dateSelect" aria-label="选择快照日期"></select></label><button class="toggle active" id="compareToggle" type="button" aria-pressed="true">与前一日对比</button></div></div></header>
<main class="wrap"><section class="summary" aria-live="polite"><div class="summary-top"><div><h2 id="summaryTitle">正在载入每日快照…</h2><p id="summaryText">请稍候</p></div><div class="quality" id="quality"></div></div></section><section class="metrics" id="metrics"></section><section class="filters" aria-label="商品筛选"><div class="filter-head"><div class="filter-title">筛选商品 <span class="filter-count" id="filterCount">100 / 100</span></div><button class="reset" id="resetFilters" type="button" disabled>清空条件</button></div><div class="filter-grid primary"><label class="field search">关键词<input id="filterQuery" type="search" placeholder="搜索品牌、标题或 ASIN"></label><label class="field">品牌<select id="filterBrand"><option value="">全部品牌</option></select></label></div><div class="filter-grid quick"><label class="field compact"><span>促销</span><select id="filterPromo"><option value="">全部状态</option><option value="detected">有促销</option><option value="none">暂无促销</option><option value="unknown">信息未知</option></select></label><label class="field compact"><span>榜单变化</span><select id="filterMovement"><option value="">全部变化</option><option value="new">新入榜</option><option value="up">排名上升</option><option value="down">排名下降</option><option value="same">排名不变</option></select></label><label class="field compact"><span>榜单范围</span><select id="filterRank"><option value="">Top 100</option><option value="10">Top 10</option><option value="20">Top 20</option><option value="50">Top 50</option></select></label><label class="field compact"><span>大类 BSR</span><select id="filterMainBsr"><option value="">不限</option><option value="1000">≤ 1,000</option><option value="5000">≤ 5,000</option><option value="10000">≤ 10,000</option><option value="50000">≤ 50,000</option></select></label><label class="field">价格区间 ($)<span class="range"><input id="filterPriceMin" type="number" min="0" step="1" placeholder="最低"><span>—</span><input id="filterPriceMax" type="number" min="0" step="1" placeholder="最高"></span></label><button class="more-filter" id="moreFilters" type="button" aria-expanded="false" aria-controls="advancedFilters">更多筛选 <span class="more-count" id="moreCount">0</span></button></div><div class="advanced-grid" id="advancedFilters" hidden><label class="field compact"><span>小类 BSR</span><select id="filterSubBsr"><option value="">不限</option><option value="10">≤ 10</option><option value="50">≤ 50</option><option value="100">≤ 100</option><option value="500">≤ 500</option></select></label><label class="field compact"><span>上架天数</span><select id="filterAge"><option value="">不限</option><option value="7">≤ 7 天</option><option value="30">≤ 30 天</option><option value="60">≤ 60 天</option><option value="90">≤ 90 天</option></select></label></div><div class="active-filters" id="activeFilters" aria-live="polite"></div></section><div class="bar"><span id="viewText"></span><a class="source" href="https://www.amazon.com/gp/new-releases/fashion/2368365011" target="_blank" rel="noreferrer">Amazon 官方新品榜</a></div><section class="grid" id="products"><div class="empty">正在载入快照…</div></section><div id="exitArea"></div><footer id="footerText"></footer></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cache=new Map();let manifest={snapshots:[]},current=null,previous=null,compareEnabled=true;
const filters={query:"",brand:"",promo:"",movement:"",rank:"",priceMin:"",priceMax:"",mainBsr:"",subBsr:"",age:""};
const $=id=>document.getElementById(id),money=v=>{const n=parseFloat(String(v||"").replace(/[^\d.]/g,""));return Number.isFinite(n)?n:null},fmt=n=>Number(n).toLocaleString("en-US");
async function json(url){const response=await fetch(url,{cache:"no-store"});if(!response.ok)throw new Error(`${response.status} ${url}`);return response.json()}
async function load(entry){if(!entry)return null;if(cache.has(entry.date))return cache.get(entry.date);const data=await json(entry.file);cache.set(entry.date,data);return data}
function age(date){if(!date)return "未显示/无法获取";const [y,m,d]=date.split("-").map(Number),a=new Date(y,m-1,d),b=new Date();b.setHours(0,0,0,0);const days=Math.floor((b-a)/86400000);return `${date} · ${days===0?"今天上架":days>0?`已上架 ${days} 天`:`${Math.abs(days)} 天后上架`}`}
function promoList(p){const text=p.promotionStatus==="none"?"暂无促销":(p.promotion||"未显示/无法获取");return String(text).split(/\s*\+\s*/).filter(Boolean)}
function comparison(){const now=current?.items||[],old=previous?.items||[],oldMap=new Map(old.map(x=>[x.asin,x])),nowMap=new Map(now.map(x=>[x.asin,x]));return {oldMap,entrants:now.filter(x=>!oldMap.has(x.asin)),exits:old.filter(x=>!nowMap.has(x.asin)),retained:now.filter(x=>oldMap.has(x.asin))}}
function ageDays(date){if(!date)return null;const [y,m,d]=date.split("-").map(Number),a=new Date(y,m-1,d),b=new Date();b.setHours(0,0,0,0);return Math.floor((b-a)/86400000)}
function movementOf(p,oldMap){const old=oldMap.get(p.asin);if(!old)return "new";if(p.rank<old.rank)return "up";if(p.rank>old.rank)return "down";return "same"}
function filteredRows(rows,oldMap){const query=filters.query.trim().toLowerCase(),min=money(filters.priceMin),max=money(filters.priceMax);return rows.filter(p=>{const price=money(p.price),sub=Number(p.subBsr)||(Array.isArray(p.subRanks)&&p.subRanks.length?Math.min(...p.subRanks.map(x=>Number(x.rank)).filter(Boolean)):0),days=ageDays(p.listingDate);if(query&&!`${p.brand||""} ${p.title||""} ${p.asin||""}`.toLowerCase().includes(query))return false;if(filters.brand&&p.brand!==filters.brand)return false;if(filters.promo&&p.promotionStatus!==filters.promo)return false;if(filters.movement&&movementOf(p,oldMap)!==filters.movement)return false;if(filters.rank&&p.rank>Number(filters.rank))return false;if(filters.priceMin!==""&&(price===null||price<min))return false;if(filters.priceMax!==""&&(price===null||price>max))return false;if(filters.mainBsr&&(!p.mainBsr||Number(p.mainBsr)>Number(filters.mainBsr)))return false;if(filters.subBsr&&(!sub||sub>Number(filters.subBsr)))return false;if(filters.age!==""&&(days===null||days<0||days>Number(filters.age)))return false;return true})}
function syncBrandOptions(){const select=$("filterBrand"),selected=filters.brand,brands=[...new Set((current?.items||[]).map(p=>p.brand).filter(Boolean))].sort((a,b)=>a.localeCompare(b));select.innerHTML='<option value="">全部品牌</option>'+brands.map(x=>`<option value="${esc(x)}"${x===selected?' selected':''}>${esc(x)}</option>`).join("");if(selected&&!brands.includes(selected)){filters.brand="";select.value=""}}
function filterLabel(key,value){if(key==="query")return `关键词：${value}`;if(key==="brand")return `品牌：${value}`;if(key==="priceMin")return `价格 ≥ $${value}`;if(key==="priceMax")return `价格 ≤ $${value}`;const id={promo:"filterPromo",movement:"filterMovement",rank:"filterRank",mainBsr:"filterMainBsr",subBsr:"filterSubBsr",age:"filterAge"}[key],option=id?$(id).selectedOptions[0]:null;return option?.textContent||value}
function renderFilterState(shown,total){const active=Object.entries(filters).filter(([,v])=>v!==""),advanced=[filters.subBsr,filters.age].filter(Boolean).length;$("filterCount").textContent=`${shown} / ${total}`;$("resetFilters").disabled=!active.length;$("moreCount").textContent=advanced;$("moreCount").classList.toggle("visible",advanced>0);$("activeFilters").innerHTML=active.map(([key,value])=>`<button class="filter-tag" type="button" data-filter-key="${key}" aria-label="移除筛选 ${esc(filterLabel(key,value))}">${esc(filterLabel(key,value))}</button>`).join("")}
function diffFor(p,oldMap){const old=oldMap.get(p.asin);if(!old)return {movement:'<div class="movement new">本期新入榜</div>',changes:[]};const delta=old.rank-p.rank,priceDelta=(money(p.price)??0)-(money(old.price)??0),bsrDelta=(Number(old.mainBsr)||0)-(Number(p.mainBsr)||0),promoChanged=(p.promotion||"")!==(old.promotion||"");const trend=delta>0?`上升 ${delta} 位`:delta<0?`下降 ${Math.abs(delta)} 位`:"名次不变";const changes=[];if(Math.abs(priceDelta)>.001)changes.push(`<span class="change ${priceDelta<0?"good":"alert"}">价格${priceDelta<0?"下降":"上涨"} $${Math.abs(priceDelta).toFixed(2)}</span>`);if(old.mainBsr&&p.mainBsr&&bsrDelta)changes.push(`<span class="change ${bsrDelta>0?"good":""}">大类 BSR ${bsrDelta>0?"提升":"下降"} ${fmt(Math.abs(bsrDelta))}</span>`);if(promoChanged)changes.push('<span class="change alert">促销状态变化</span>');return {movement:`<div class="movement ${delta>0?"up":delta<0?"down":""}">前期 #${old.rank} → 本期 #${p.rank} · ${trend}</div>`,changes}}
function card(p,oldMap,compare){const old=oldMap.get(p.asin),diff=diffFor(p,oldMap),main=p.mainBsr?`#${fmt(p.mainBsr)}`:"未显示",subs=Array.isArray(p.subRanks)&&p.subRanks.length?p.subRanks:(p.subBsr?[{rank:p.subBsr,category:p.subCategory}]:[]),subHtml=subs.length?subs.map(x=>`<span class="chip" title="${esc(x.category||"")}">小类 #${fmt(x.rank)}</span>`).join(""):'<span class="chip">小类 未显示</span>',promos=promoList(p),promoHtml=promos.map(x=>`<span class="chip promo ${p.promotionStatus==="none"?"none":""}">${esc(x)}</span>`).join(""),h=p.history||{},isNew=compare&&!old;return `<article class="card"><div class="photo"><img loading="lazy" src="${esc(p.image)}" alt="${esc(p.title)}"><span class="rank ${isNew?"new":""}">${isNew?"NEW · ":"新品 "}#${p.rank}</span><span class="price">${esc(p.price||"价格未显示")}</span></div><div class="body"><div class="brand">${esc(p.brand||"品牌未显示")}</div><div class="title" title="${esc(p.title)}">${esc(p.title)}</div>${compare?diff.movement:""}${compare&&diff.changes.length?`<div class="changes">${diff.changes.join("")}</div>`:""}<div class="chips"><span class="chip" title="${esc(p.mainCategory||"")}">大类 ${main}</span>${subHtml}${promoHtml}</div><div class="history"><span>首次发现 ${esc(h.firstSeen||current.snapshotDate)}</span><span>连续在榜 ${h.streak||1} 天</span></div><div class="date"><span>上架时间</span><b>${esc(age(p.listingDate))}</b></div><div class="actions"><span class="asin">${esc(p.asin)}</span><a href="${esc(p.url)}" target="_blank" rel="noreferrer">商品详情</a></div></div></article>`}
function render(){const allRows=current?.items||[],q=current?.quality||{},cmp=comparison(),rows=filteredRows(allRows,cmp.oldMap),compare=compareEnabled&&previous,priceChanges=cmp.retained.filter(p=>{const o=cmp.oldMap.get(p.asin);return Math.abs((money(p.price)??0)-(money(o.price)??0))>.001}),promoChanges=cmp.retained.filter(p=>(p.promotion||"")!==(cmp.oldMap.get(p.asin).promotion||"")),bsrImproved=cmp.retained.filter(p=>p.mainBsr&&cmp.oldMap.get(p.asin).mainBsr&&p.mainBsr<cmp.oldMap.get(p.asin).mainBsr),promos=allRows.filter(p=>p.promotionStatus==="detected");const metrics=compare?[["本期商品",allRows.length],["新入榜",cmp.entrants.length,"blue"],["退出榜",cmp.exits.length,"orange"],["价格变化",priceChanges.length,"purple"],["促销变化",promoChanges.length,"orange"],["BSR 提升",bsrImproved.length,"green"]]:[["榜单商品",allRows.length],["促销商品",promos.length,"green"],["品牌完整",q.fieldCoverage?.brand||0],["BSR 完整",Math.min(q.fieldCoverage?.mainBsr||0,q.fieldCoverage?.subBsr||0),"blue"],["上架日期",q.fieldCoverage?.listingDate||0],["缺失名次",q.missingRanks?.length||0,"orange"]];$("metrics").innerHTML=metrics.map(x=>`<div class="metric ${x[2]||""}"><span>${x[0]}</span><b>${x[1]}</b><small>/ 100</small></div>`).join("");$("summaryTitle").textContent=`${current.snapshotDate} 新品榜观察`;$("summaryText").textContent=compare?`新入榜 ${cmp.entrants.length} 个，退出 ${cmp.exits.length} 个；${priceChanges.length} 个商品价格变化，${promoChanges.length} 个促销状态变化，${bsrImproved.length} 个商品大类 BSR 提升。`:`当前共收录 ${allRows.length} 个商品，其中 ${promos.length} 个检测到促销。`;$("quality").innerHTML=`数据校验 <b>${q.publishable?"已通过":"未通过"}</b><br>品牌 ${q.fieldCoverage?.brand||0}/100 · BSR ${q.fieldCoverage?.mainBsr||0}/100 · 上架日期 ${q.fieldCoverage?.listingDate||0}/100`;renderFilterState(rows.length,allRows.length);$("viewText").innerHTML=`<strong>${current.snapshotDate} · ${current.capturedAt.slice(11,16)}</strong>（北京时间）· 显示 ${rows.length}/${allRows.length} 件 · 每行 5 件${compare?` · 对比 ${previous.snapshotDate}`:""}`;$("products").innerHTML=rows.length?rows.map(p=>card(p,cmp.oldMap,compare)).join(""):'<div class="empty">没有符合当前筛选条件的商品，请调整或重置筛选。</div>';$("exitArea").innerHTML=compare?`<details class="exits"><summary>查看前一快照退出榜单的 ${cmp.exits.length} 个商品</summary><div class="exit-grid">${cmp.exits.map(p=>`<div class="exit"><img loading="lazy" src="${esc(p.image)}" alt=""><div><b>前期 #${p.rank} · ${esc(p.brand||p.asin)}</b><span>${esc(p.title)}</span></div></div>`).join("")}</div></details>`:"";$("footerText").textContent=`历史快照 ${manifest.snapshots.length} 期 · 最近更新 ${manifest.updatedAt?.replace("T"," ").slice(0,16)||"—"} · 数据仅用于市场观察`}
async function selectSnapshot(date){const index=manifest.snapshots.findIndex(x=>x.date===date),entry=manifest.snapshots[index],previousEntry=manifest.snapshots[index+1]||null;$("products").innerHTML='<div class="empty">正在载入快照…</div>';[current,previous]=await Promise.all([load(entry),load(previousEntry)]);compareEnabled=Boolean(previous);$("compareToggle").disabled=!previous;$("compareToggle").classList.toggle("active",compareEnabled);$("compareToggle").setAttribute("aria-pressed",String(compareEnabled));syncBrandOptions();render()}
async function init(){try{manifest=await json("data/manifest.json");const select=$("dateSelect");select.innerHTML=manifest.snapshots.map((x,i)=>`<option value="${esc(x.date)}"${i===0?" selected":""}>${esc(x.date)} · ${esc(x.capturedAt.slice(11,16))}</option>`).join("");select.addEventListener("change",()=>selectSnapshot(select.value));$("compareToggle").addEventListener("click",()=>{if(!previous)return;compareEnabled=!compareEnabled;$("compareToggle").classList.toggle("active",compareEnabled);$("compareToggle").setAttribute("aria-pressed",String(compareEnabled));render()});const bindings={filterQuery:"query",filterBrand:"brand",filterPromo:"promo",filterMovement:"movement",filterRank:"rank",filterPriceMin:"priceMin",filterPriceMax:"priceMax",filterMainBsr:"mainBsr",filterSubBsr:"subBsr",filterAge:"age"};Object.entries(bindings).forEach(([id,key])=>$(id).addEventListener(id==="filterQuery"||id.startsWith("filterPrice")?"input":"change",event=>{filters[key]=event.target.value;render()}));$("moreFilters").addEventListener("click",()=>{const expanded=$("moreFilters").getAttribute("aria-expanded")==="true";$("moreFilters").setAttribute("aria-expanded",String(!expanded));$("advancedFilters").hidden=expanded});$("resetFilters").addEventListener("click",()=>{Object.keys(filters).forEach(key=>filters[key]="");Object.entries(bindings).forEach(([id])=>$(id).value="");render()});$("activeFilters").addEventListener("click",event=>{const button=event.target.closest("[data-filter-key]");if(!button)return;const key=button.dataset.filterKey,entry=Object.entries(bindings).find(([,value])=>value===key);filters[key]="";if(entry)$(entry[0]).value="";render()});await selectSnapshot(manifest.latest)}catch(error){$("summaryTitle").textContent="快照载入失败";$("summaryText").textContent="请稍后刷新页面重试。";$("products").innerHTML=`<div class="empty">${esc(error.message)}</div>`}}init();
</script>
