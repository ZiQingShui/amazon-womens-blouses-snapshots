<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Amazon 美国站女式衬衫新品榜 Top 100 每日历史快照与变化看板">
<title>女式衬衫新品榜｜每日快照</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23d92d20'/%3E%3Cpath d='M17 43V21h7l16 13V21h7v22h-7L24 30v13z' fill='white'/%3E%3C/svg%3E">
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#162033;--muted:#667085;--line:#e3e8ef;--red:#d92d20;--blue:#175cd3;--green:#087a55;--orange:#b54708;--purple:#6941c6}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,system-ui,"Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}button,select{font:inherit}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.wrap{max-width:1720px;margin:auto;padding:16px 24px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px}.heading{display:flex;align-items:center;gap:12px}.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--red);color:#fff;font-weight:900;box-shadow:0 7px 18px rgba(217,45,32,.22)}h1{margin:0;font-size:21px;line-height:1.25}.sub{margin-top:2px;color:var(--muted);font-size:12px}
.controls{display:flex;align-items:center;gap:8px}.picker{display:flex;align-items:center;gap:8px;padding:5px 7px 5px 11px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--muted);font-size:12px}.picker select{min-width:175px;border:0;outline:0;background:#f2f4f7;color:var(--ink);padding:8px 10px;border-radius:8px;font-weight:800;cursor:pointer}.toggle{border:1px solid #b2ccff;border-radius:11px;background:#eef4ff;padding:9px 12px;color:var(--blue);font-size:13px;font-weight:800;cursor:pointer}.toggle:not(.active){border-color:var(--line);background:#fff;color:#475467}.toggle:disabled{opacity:.45;cursor:not-allowed}
.summary{margin-top:16px;padding:16px 18px;border:1px solid #dbe4f0;border-radius:17px;background:linear-gradient(120deg,#162033,#263853);color:#fff;box-shadow:0 12px 30px rgba(15,23,42,.12)}.summary-top{display:flex;justify-content:space-between;gap:18px}.summary h2{margin:0;font-size:16px}.summary p{margin:5px 0 0;color:#d8e1ed}.quality{color:#cbd5e1;font-size:12px;text-align:right}.quality b{color:#fff}
.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:14px 0}.metric{padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:#fff}.metric span{display:block;color:var(--muted);font-size:12px}.metric b{display:block;margin-top:2px;font-size:20px}.metric small{color:var(--muted)}.metric.green b{color:var(--green)}.metric.blue b{color:var(--blue)}.metric.orange b{color:var(--orange)}.metric.purple b{color:var(--purple)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0;color:var(--muted);font-size:13px}.bar strong{color:var(--ink)}.source{color:var(--blue);text-decoration:none;font-weight:800}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.card{min-width:0;overflow:hidden;border-radius:19px;background:var(--card);box-shadow:0 7px 22px rgba(21,35,67,.085);transition:.18s}.card:hover{transform:translateY(-3px);box-shadow:0 15px 34px rgba(21,35,67,.14)}.photo{position:relative;aspect-ratio:1/1;display:grid;place-items:center;background:#fff}.photo img{width:100%;height:100%;object-fit:contain;padding:14px}.rank{position:absolute;left:13px;top:13px;padding:6px 10px;border-radius:999px;background:rgba(22,32,51,.94);color:#fff;font-size:12px;font-weight:850}.rank.new{background:var(--red)}.price{position:absolute;right:13px;bottom:13px;padding:7px 10px;border-radius:10px;background:#fff;color:#b42318;box-shadow:0 5px 18px rgba(16,24,40,.17);font-size:20px;font-weight:900}
.body{padding:15px}.brand{margin-bottom:5px;color:var(--muted);font-size:12px;font-weight:850;letter-spacing:.06em;text-transform:uppercase}.title{height:44px;overflow:hidden;color:#202939;font-size:14px;line-height:22px;font-weight:700}.movement{margin-top:10px;padding:8px 9px;border-radius:9px;background:#f6f7f9;color:#475467;font-size:12px;font-weight:750}.movement.up{background:#eaf7f1;color:var(--green)}.movement.down{background:#fff4ed;color:var(--orange)}.movement.new{background:#fff1f0;color:#b42318}.changes{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.change{padding:4px 7px;border-radius:7px;background:#f2f4f7;color:#475467;font-size:11px}.change.alert{background:#fff1f0;color:#b42318}.change.good{background:#eaf7f1;color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{max-width:100%;padding:6px 8px;border-radius:999px;background:#eef4ff;color:#244b9b;font-size:12px;font-weight:800;line-height:1.35}.chip.promo{background:#fff1f0;color:#b42318}.chip.none{background:#eaf7f1;color:var(--green)}.history{display:flex;justify-content:space-between;gap:6px;margin-top:10px;color:var(--muted);font-size:11px}.date{display:flex;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid #edf0f4;color:var(--muted);font-size:12px}.date b{color:#344054;text-align:right}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:11px}.asin{color:var(--muted);font:11px ui-monospace,Consolas,monospace}.actions a{color:var(--blue);font-weight:800;text-decoration:none}
.exits{margin:24px 0;border:1px solid var(--line);border-radius:16px;background:#fff}.exits summary{cursor:pointer;padding:15px 17px;font-weight:850}.exit-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px 16px}.exit{display:flex;align-items:center;gap:9px;padding:8px;border-radius:10px;background:#f7f8fa}.exit img{width:48px;height:48px;object-fit:contain;border-radius:8px;background:#fff}.exit div{min-width:0}.exit b,.exit span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.exit b{font-size:12px}.exit span{color:var(--muted);font-size:11px}.empty{grid-column:1/-1;padding:55px;text-align:center;background:#fff;border-radius:16px;color:var(--muted)}footer{padding:28px 0 10px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:1300px){.grid{grid-template-columns:repeat(4,1fr)}.metrics{grid-template-columns:repeat(3,1fr)}}@media(max-width:940px){.grid{grid-template-columns:repeat(3,1fr)}.top,.summary-top{align-items:flex-start;flex-direction:column}.controls{width:100%}.quality{text-align:left}.exit-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.wrap{padding:13px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.metrics{grid-template-columns:repeat(2,1fr)}.bar{align-items:flex-start;flex-direction:column}.controls{align-items:stretch;flex-direction:column}.picker{justify-content:space-between}.picker select{flex:1}.toggle{width:100%}}@media(max-width:430px){.grid,.metrics,.exit-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap top"><div class="heading"><div class="mark">NEW</div><div><h1>女式衬衫新品榜｜每日快照</h1><div class="sub">Amazon 美国站 · Women's Blouses &amp; Button-Down Shirts · Top 100</div></div></div><div class="controls"><label class="picker">快照日期<select id="dateSelect" aria-label="选择快照日期"></select></label><button class="toggle active" id="compareToggle" type="button" aria-pressed="true">与前一日对比</button></div></div></header>
<main class="wrap"><section class="summary" aria-live="polite"><div class="summary-top"><div><h2 id="summaryTitle">正在载入每日快照…</h2><p id="summaryText">请稍候</p></div><div class="quality" id="quality"></div></div></section><section class="metrics" id="metrics"></section><div class="bar"><span id="viewText"></span><a class="source" href="https://www.amazon.com/gp/new-releases/fashion/2368365011" target="_blank" rel="noreferrer">Amazon 官方新品榜</a></div><section class="grid" id="products"><div class="empty">正在载入快照…</div></section><div id="exitArea"></div><footer id="footerText"></footer></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cache=new Map();let manifest={snapshots:[]},current=null,previous=null,compareEnabled=true;
const $=id=>document.getElementById(id),money=v=>{const n=parseFloat(String(v||"").replace(/[^\d.]/g,""));return Number.isFinite(n)?n:null},fmt=n=>Number(n).toLocaleString("en-US");
async function json(url){const response=await fetch(url,{cache:"no-store"});if(!response.ok)throw new Error(`${response.status} ${url}`);return response.json()}
async function load(entry){if(!entry)return null;if(cache.has(entry.date))return cache.get(entry.date);const data=await json(entry.file);cache.set(entry.date,data);return data}
function age(date){if(!date)return "未显示/无法获取";const [y,m,d]=date.split("-").map(Number),a=new Date(y,m-1,d),b=new Date();b.setHours(0,0,0,0);const days=Math.floor((b-a)/86400000);return `${date} · ${days===0?"今天上架":days>0?`已上架 ${days} 天`:`${Math.abs(days)} 天后上架`}`}
function promoList(p){const text=p.promotionStatus==="none"?"暂无促销":(p.promotion||"未显示/无法获取");return String(text).split(/\s*\+\s*/).filter(Boolean)}
function comparison(){const now=current?.items||[],old=previous?.items||[],oldMap=new Map(old.map(x=>[x.asin,x])),nowMap=new Map(now.map(x=>[x.asin,x]));return {oldMap,entrants:now.filter(x=>!oldMap.has(x.asin)),exits:old.filter(x=>!nowMap.has(x.asin)),retained:now.filter(x=>oldMap.has(x.asin))}}
function diffFor(p,oldMap){const old=oldMap.get(p.asin);if(!old)return {movement:'<div class="movement new">本期新入榜</div>',changes:[]};const delta=old.rank-p.rank,priceDelta=(money(p.price)??0)-(money(old.price)??0),bsrDelta=(Number(old.mainBsr)||0)-(Number(p.mainBsr)||0),promoChanged=(p.promotion||"")!==(old.promotion||"");const trend=delta>0?`上升 ${delta} 位`:delta<0?`下降 ${Math.abs(delta)} 位`:"名次不变";const changes=[];if(Math.abs(priceDelta)>.001)changes.push(`<span class="change ${priceDelta<0?"good":"alert"}">价格${priceDelta<0?"下降":"上涨"} $${Math.abs(priceDelta).toFixed(2)}</span>`);if(old.mainBsr&&p.mainBsr&&bsrDelta)changes.push(`<span class="change ${bsrDelta>0?"good":""}">大类 BSR ${bsrDelta>0?"提升":"下降"} ${fmt(Math.abs(bsrDelta))}</span>`);if(promoChanged)changes.push('<span class="change alert">促销状态变化</span>');return {movement:`<div class="movement ${delta>0?"up":delta<0?"down":""}">前期 #${old.rank} → 本期 #${p.rank} · ${trend}</div>`,changes}}
function card(p,oldMap,compare){const old=oldMap.get(p.asin),diff=diffFor(p,oldMap),main=p.mainBsr?`#${fmt(p.mainBsr)}`:"未显示",subs=Array.isArray(p.subRanks)&&p.subRanks.length?p.subRanks:(p.subBsr?[{rank:p.subBsr,category:p.subCategory}]:[]),subHtml=subs.length?subs.map(x=>`<span class="chip" title="${esc(x.category||"")}">小类 #${fmt(x.rank)}</span>`).join(""):'<span class="chip">小类 未显示</span>',promos=promoList(p),promoHtml=promos.map(x=>`<span class="chip promo ${p.promotionStatus==="none"?"none":""}">${esc(x)}</span>`).join(""),h=p.history||{},isNew=compare&&!old;return `<article class="card"><div class="photo"><img loading="lazy" src="${esc(p.image)}" alt="${esc(p.title)}"><span class="rank ${isNew?"new":""}">${isNew?"NEW · ":"新品 "}#${p.rank}</span><span class="price">${esc(p.price||"价格未显示")}</span></div><div class="body"><div class="brand">${esc(p.brand||"品牌未显示")}</div><div class="title" title="${esc(p.title)}">${esc(p.title)}</div>${compare?diff.movement:""}${compare&&diff.changes.length?`<div class="changes">${diff.changes.join("")}</div>`:""}<div class="chips"><span class="chip" title="${esc(p.mainCategory||"")}">大类 ${main}</span>${subHtml}${promoHtml}</div><div class="history"><span>首次发现 ${esc(h.firstSeen||current.snapshotDate)}</span><span>连续在榜 ${h.streak||1} 天</span></div><div class="date"><span>上架时间</span><b>${esc(age(p.listingDate))}</b></div><div class="actions"><span class="asin">${esc(p.asin)}</span><a href="${esc(p.url)}" target="_blank" rel="noreferrer">商品详情</a></div></div></article>`}
function render(){const rows=current?.items||[],q=current?.quality||{},cmp=comparison(),compare=compareEnabled&&previous,priceChanges=cmp.retained.filter(p=>{const o=cmp.oldMap.get(p.asin);return Math.abs((money(p.price)??0)-(money(o.price)??0))>.001}),promoChanges=cmp.retained.filter(p=>(p.promotion||"")!==(cmp.oldMap.get(p.asin).promotion||"")),bsrImproved=cmp.retained.filter(p=>p.mainBsr&&cmp.oldMap.get(p.asin).mainBsr&&p.mainBsr<cmp.oldMap.get(p.asin).mainBsr),promos=rows.filter(p=>p.promotionStatus==="detected");const metrics=compare?[["本期商品",rows.length],["新入榜",cmp.entrants.length,"blue"],["退出榜",cmp.exits.length,"orange"],["价格变化",priceChanges.length,"purple"],["促销变化",promoChanges.length,"orange"],["BSR 提升",bsrImproved.length,"green"]]:[["榜单商品",rows.length],["促销商品",promos.length,"green"],["品牌完整",q.fieldCoverage?.brand||0],["BSR 完整",Math.min(q.fieldCoverage?.mainBsr||0,q.fieldCoverage?.subBsr||0),"blue"],["上架日期",q.fieldCoverage?.listingDate||0],["缺失名次",q.missingRanks?.length||0,"orange"]];$("metrics").innerHTML=metrics.map(x=>`<div class="metric ${x[2]||""}"><span>${x[0]}</span><b>${x[1]}</b><small>/ 100</small></div>`).join("");$("summaryTitle").textContent=`${current.snapshotDate} 新品榜观察`;$("summaryText").textContent=compare?`新入榜 ${cmp.entrants.length} 个，退出 ${cmp.exits.length} 个；${priceChanges.length} 个商品价格变化，${promoChanges.length} 个促销状态变化，${bsrImproved.length} 个商品大类 BSR 提升。`:`当前共收录 ${rows.length} 个商品，其中 ${promos.length} 个检测到促销。`;$("quality").innerHTML=`数据校验 <b>${q.publishable?"已通过":"未通过"}</b><br>品牌 ${q.fieldCoverage?.brand||0}/100 · BSR ${q.fieldCoverage?.mainBsr||0}/100 · 上架日期 ${q.fieldCoverage?.listingDate||0}/100`;$("viewText").innerHTML=`<strong>${current.snapshotDate} · ${current.capturedAt.slice(11,16)}</strong>（北京时间）· Top ${rows.length} · 每行 5 件${compare?` · 对比 ${previous.snapshotDate}`:""}`;$("products").innerHTML=rows.length?rows.map(p=>card(p,cmp.oldMap,compare)).join(""):'<div class="empty">该日期没有可用快照</div>';$("exitArea").innerHTML=compare?`<details class="exits"><summary>查看前一快照退出榜单的 ${cmp.exits.length} 个商品</summary><div class="exit-grid">${cmp.exits.map(p=>`<div class="exit"><img loading="lazy" src="${esc(p.image)}" alt=""><div><b>前期 #${p.rank} · ${esc(p.brand||p.asin)}</b><span>${esc(p.title)}</span></div></div>`).join("")}</div></details>`:"";$("footerText").textContent=`历史快照 ${manifest.snapshots.length} 期 · 最近更新 ${manifest.updatedAt?.replace("T"," ").slice(0,16)||"—"} · 数据仅用于市场观察`}
async function selectSnapshot(date){const index=manifest.snapshots.findIndex(x=>x.date===date),entry=manifest.snapshots[index],previousEntry=manifest.snapshots[index+1]||null;$("products").innerHTML='<div class="empty">正在载入快照…</div>';[current,previous]=await Promise.all([load(entry),load(previousEntry)]);compareEnabled=Boolean(previous);$("compareToggle").disabled=!previous;$("compareToggle").classList.toggle("active",compareEnabled);$("compareToggle").setAttribute("aria-pressed",String(compareEnabled));render()}
async function init(){try{manifest=await json("data/manifest.json");const select=$("dateSelect");select.innerHTML=manifest.snapshots.map((x,i)=>`<option value="${esc(x.date)}"${i===0?" selected":""}>${esc(x.date)} · ${esc(x.capturedAt.slice(11,16))}</option>`).join("");select.addEventListener("change",()=>selectSnapshot(select.value));$("compareToggle").addEventListener("click",()=>{if(!previous)return;compareEnabled=!compareEnabled;$("compareToggle").classList.toggle("active",compareEnabled);$("compareToggle").setAttribute("aria-pressed",String(compareEnabled));render()});await selectSnapshot(manifest.latest)}catch(error){$("summaryTitle").textContent="快照载入失败";$("summaryText").textContent="请稍后刷新页面重试。";$("products").innerHTML=`<div class="empty">${esc(error.message)}</div>`}}init();
</script>
</body>
